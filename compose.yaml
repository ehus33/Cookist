services:
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      COOKIST_AUTH_MODE: ${COOKIST_AUTH_MODE:-demo}
      COOKIST_COGNITO_ISSUER: ${COOKIST_COGNITO_ISSUER:-}
      COOKIST_COGNITO_CLIENT_IDS: ${COOKIST_COGNITO_CLIENT_IDS:-}
    expose: ["8081"]
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        VITE_AUTH_MODE: ${COOKIST_AUTH_MODE:-demo}
        VITE_COGNITO_ISSUER: ${COOKIST_COGNITO_ISSUER:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-}
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CORE_URL: http://core:8081
      WEB_DIST: /app/web
      COOKIST_AUTH_MODE: ${COOKIST_AUTH_MODE:-demo}
      COOKIST_DEPLOYMENTS_ENABLED: ${COOKIST_DEPLOYMENTS_ENABLED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      COOKIST_DEPLOYMENT_OWNER: ${COOKIST_DEPLOYMENT_OWNER:-}
      COOKIST_DEPLOYMENT_ACCESS_FILE: ${COOKIST_DEPLOYMENT_ACCESS_FILE:-}
      COOKIST_DEPLOYMENT_ACCESS_MODE: hosted
      COOKIST_BILLING_ENABLED: ${COOKIST_BILLING_ENABLED:-false}
      COOKIST_SELF_SERVICE_BILLING: ${COOKIST_SELF_SERVICE_BILLING:-false}
      COOKIST_PUBLIC_ORIGIN: ${COOKIST_PUBLIC_ORIGIN:-}
      COOKIST_STRIPE_MODE: ${COOKIST_STRIPE_MODE:-test}
      COOKIST_STRIPE_PRICE_ID: ${COOKIST_STRIPE_PRICE_ID:-}
      COOKIST_STRIPE_SECRET_KEY: ${COOKIST_STRIPE_SECRET_KEY:-}
      COOKIST_STRIPE_WEBHOOK_SECRET: ${COOKIST_STRIPE_WEBHOOK_SECRET:-}
      COOKIST_DEPLOYMENT_ROOT: /app/deployments
      COOKIST_TERRAFORM_PATH: /usr/local/bin/terraform
      COOKIST_AWS_ACCOUNT_ID: ${COOKIST_AWS_ACCOUNT_ID:-}
    depends_on: [core]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["deployment-state:/app/deployments"]
    restart: unless-stopped

volumes:
  deployment-state:
