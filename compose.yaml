services:
  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      COOKIST_DB: /app/data/cookist.db
      COOKIST_CATALOG: /app/shared/catalog.json
    volumes:
      - cookist-data:/app/data
    expose: ["8081"]
    restart: unless-stopped
  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      CORE_URL: http://core:8081
    depends_on: [core]
    expose: ["8082"]
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      CORE_URL: http://core:8081
      SEARCH_URL: http://search:8082
      WEB_DIST: /app/web
    depends_on: [core, search]
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
volumes:
  cookist-data:
